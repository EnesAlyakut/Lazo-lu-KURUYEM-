services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lazoglu}
      MYSQL_USER: ${MYSQL_USER:-lazoglu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD .env dosyasında tanımlanmalı}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD .env dosyasında tanımlanmalı}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-LAZOĞLU KURUYEMİŞ}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-lazoglu}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-lazoglu}
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      NEXTAUTH_URL: https://${SITE_DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
    networks: [backend, web]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN .env dosyasında tanımlanmalı}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/srv/uploads:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [web]

networks:
  backend:
    internal: true
  web:

volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:
